
name: Build MyDrivePlayer APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Estrai e compila APK
        run: |
          unzip -q MyDrivePlayer_Android_Project.zip
          cd MyDrivePlayer_Android_Project
          gradle --no-daemon assembleDebug

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: MyDrivePlayer-APK
          path: MyDrivePlayer_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          
